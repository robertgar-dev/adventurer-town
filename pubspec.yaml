name: adventurer_town
description: Adventurer Town — a cozy idle/economy game in pure Flutter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  firebase_analytics: ^11.4.0
  firebase_core: ^3.10.0
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.5
  # Spatial render surface (FD1, 2026-06-20: §IV amended to permit a game engine).
  flame: ^1.18.0

dev_dependencies:
  build_runner: ^2.4.14
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  isar_community_generator: ^3.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/characters/
    - assets/buildings/
